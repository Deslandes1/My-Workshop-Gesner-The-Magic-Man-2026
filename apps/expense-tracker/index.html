<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Expense Tracker</title>
<style>
  :root {
    --bg: #e0f2fe; --card: #f0f9ff; --text: #0c4a6e; --muted: #0369a1;
    --border: #7dd3fc; --primary: #0284c7; --primary-hover: #0369a1;
    --danger: #ef4444; --danger-hover: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    background: linear-gradient(180deg, #e0f2fe 0%, #f0f9ff 100%);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
  }
  .app {
    max-width: 520px; margin: 0 auto; background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px; padding: 24px;
    box-shadow: 0 10px 30px rgba(2, 132, 199, 0.12);
  }
  h1 { margin-top: 0; font-size: 1.5rem; text-align: center; color: var(--text); }
  .row { display: flex; gap: 8px; }
  input {
    flex: 1; padding: 12px; border: 1px solid var(--border);
    border-radius: 10px; font-size: 1rem; background: #fff;
    color: var(--text); outline: none;
  }
  input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(2,132,199,.18); }
  button {
    padding: 12px 16px; border: 0; border-radius: 10px;
    background: var(--primary); color: #fff; font-weight: 600; cursor: pointer;
    transition: background .15s;
  }
  button:hover { background: var(--primary-hover); }
  ul { list-style: none; padding: 0; margin: 16px 0 0; }
  li {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; padding: 12px; border: 1px solid var(--border);
    border-radius: 10px; margin-bottom: 8px; background: #fff;
  }
  .delete {
    background: var(--danger); padding: 8px 12px;
    font-size: .9rem; flex-shrink: 0;
  }
  .delete:hover { background: var(--danger-hover); }
  .empty { color: var(--muted); text-align: center; padding: 16px; }
</style>
</head>
<body>
  <div class="app">
    <h1>Expense Tracker</h1>
    <div class="row">
      <input id="item" placeholder="Enter expense..." autocomplete="off">
      <button id="addBtn" type="button">Add</button>
    </div>
    <ul id="list"></ul>
  </div>
  <script>
    const storage = {
      get() { try { return JSON.parse(localStorage.getItem('items') || '[]'); } catch { return []; } },
      set(v) { try { localStorage.setItem('items', JSON.stringify(v)); } catch {} }
    };
    let items = storage.get();
    const inputEl = document.getElementById('item');
    const listEl = document.getElementById('list');
    const escapeHtml = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    function render() {
      listEl.innerHTML = items.length === 0
        ? '<li class="empty">No expenses yet.</li>'
        : items.map((it, i) => `<li><span>${escapeHtml(it)}</span><button class="delete" data-index="${i}">Delete</button></li>`).join('');
    }
    function add() {
      const v = inputEl.value.trim();
      if (!v) return;
      items.push(v); storage.set(items);
      inputEl.value = ''; inputEl.focus(); render();
    }
    document.getElementById('addBtn').addEventListener('click', add);
    inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') add(); });
    listEl.addEventListener('click', e => {
      const btn = e.target.closest('.delete'); if (!btn) return;
      items.splice(Number(btn.dataset.index), 1); storage.set(items); render();
    });
    render();
  </script>
</body>
</html>
